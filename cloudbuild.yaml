steps:
  # ── Backend ───────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-backend
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/traderjg-backend:latest"
      - ./backend

  - name: "gcr.io/cloud-builders/docker"
    id: push-backend
    waitFor: [build-backend]
    args:
      - push
      - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-backend
    waitFor: [push-backend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - traderjg-backend
      - --image=gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
      - --set-secrets=GOOGLE_API_KEY=GEMINI_API_KEY:latest,FRED_API_KEY=FRED_API_KEY:latest

  # ── Frontend ──────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-frontend
    waitFor: [deploy-backend]
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"
      - --build-arg
      - "VITE_API_URL=/api"
      - ./frontend

  - name: "gcr.io/cloud-builders/docker"
    id: push-frontend
    waitFor: [build-frontend]
    args:
      - push
      - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-frontend
    waitFor: [push-frontend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - traderjg-frontend
      - --image=gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --set-env-vars=BACKEND_URL=https://traderjg-backend-HASH-uc.a.run.app

images:
  - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
