steps:
  # Build and push backend image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"
      - ./backend

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"

  # Build and push frontend image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"
      - ./frontend

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"

  # Deploy backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - traderjg-backend
      - --image=gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1

  # Deploy frontend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - traderjg-frontend
      - --image=gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1

images:
  - "gcr.io/$PROJECT_ID/traderjg-backend:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/traderjg-frontend:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
